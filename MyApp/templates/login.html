
{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Scientiaarc Solutions LLP | Scientiaarcsolutions.com</title>

    <link rel="icon" type="image/x-icon" href="{% static 'img/bird-colorful-gradient-design-vector_343694-2506.avif' %}">

    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

    <link rel="stylesheet" href="{% static 'css/login.css' %}">
</head>

<body class="form-login-body">
    {% include 'partials/messages_toast.html' %}

    <video autoplay muted loop id="bg-video">
        <source src="{% static '/videos/video.mov' %}" type="video/mp4">
        Your browser does not support HTML5 video.
    </video>

    <form action="" method="POST" name="login" autocomplete="off">
        {% csrf_token %}
        <div class="container-fluid min-vh-100 d-flex align-items-center justify-content-center">
            <div class="row w-100 d-flex align-items-center justify-content-center">
                <div class="col-lg-8 col-md-9 col-sm-11 login-desk">
                    <div class="row align-items-center">

                        <div class="col-md-7 text-center detail-box py-5">
                            <img src="{% static 'img/logo.png' %}" alt="Logo">
                        </div>

                        <div class="col-md-5 loginform">
                            <h4>Welcome to Scientiaarc</h4>
                            <p>Login to View Your Details!</p>

                            <div class="form-row">
                                <label>Username / Client ID</label>
                                <div class="input-group mb-3">
                                    <span class="left-icon"><i class="far fa-user"></i></span>
                                    <input style="color: #fff;" type="text" name="identifier" class="form-control"
                                        placeholder="Enter Username (Admin) or Client ID" required>
                                </div>
                            </div>

                            <div class="form-row">
                                <label>Password</label>
                                <div class="input-group mb-3 password-wrapper">
                                    <span class="left-icon"><i class="fas fa-lock"></i></span>
                                    <input style="color: #fff;" type="password" id="password" name="password"
                                        class="form-control" placeholder="Enter Your Password" required>
                                    <span class="password-toggle-icon" onclick="togglePassword()">
                                        <i id="toggleIcon" class="fas fa-eye"></i>
                                    </span>
                                </div>
                            </div>

                            <p class="forget"><a href="#">Forget Password?</a></p>
                            <button type="submit" class="btn btn-sm btn-danger">Login</button>
                            <hr>
                            <p class="mb-0 text-white">New company? <a href="{% url 'register_company' %}" class="text-info">Start 7-day free trial</a></p>

                        </div>
                    </div>
                </div>
            </div>
        </div>
    </form>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous"></script>

    <script src="{% static 'js/login.js' %}"></script>


</body>

</html>
